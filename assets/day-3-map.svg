<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 900" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">10月25日台南親子食旅路線・安平牛肉湯、三井Outlet、三大牛肉火鍋文化店</title>
<desc id="svg-desc">北方在上之藝術示意地圖。早上從安平留飯店出門；11:00安平文章牛肉湯或附近牛肉湯；13:00至15:30 MITSUI OUTLET PARK台南，17:00到永康三大牛肉火鍋文化店。地點可點擊啟動Google Maps導航；線條是示意，不代表實際道路。</desc>
