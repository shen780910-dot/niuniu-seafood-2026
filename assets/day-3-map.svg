<text x="62" y="66" class="serif" font-size="39" letter-spacing="1">台南慢遊｜牛肉湯・三井親子逛街</text>
<text x="65" y="104" font-family="Georgia,serif" font-size="18" font-style="italic" letter-spacing="2" fill="#99775b">SUNDAY · 25 OCT 2026   /   FAMILY ROAD TRIP</text>
<line x1="62" y1="117" x2="1037" y2="117" stroke="#cabc9f" stroke-width="2"/>
