<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 910" role="img" aria-labelledby="title desc">
<title id="title">10月25日台南北上方向校正的親子行程手繪地圖</title>
<desc id="desc">北方朝上、東方朝右的台南示意地圖。文章牛肉湯在安平留飯店西北側；三井Outlet位於安平東南方；三大牛肉火鍋文化店在三井的西北方。行程是11點午餐、13點三井、17點永康晚餐。所有地點都可以點選開啟Google Maps。路線僅示意先後順序，非精確道路。</desc>
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="3" seed="14" result="noise"/><feColorMatrix in="noise" type="matrix" values="0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .20 0 0 0 .075 0"/></filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#51453a" flood-opacity=".14"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#899b8b" opacity=".30"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#a75042" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .serif{font-family:"Noto Serif TC",KaiTi,DFKai-SB,serif;fill:#2a423d;font-weight:750}
    .sans{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    .micro{font-family:"Noto Sans TC",sans-serif;fill:#697d74;font-size:15px;letter-spacing:1.6px}
    .navtxt{font-family:"Noto Sans TC",sans-serif;fill:#aa513e;font-size:16px}
    a{cursor:pointer}a:hover .spot,a:focus .spot{stroke:#bc7e3e;stroke-width:4}a:hover .navtxt,a:focus .navtxt{fill:#873729;text-decoration:underline}
    a:focus{outline:none}
  </style>
</defs>
